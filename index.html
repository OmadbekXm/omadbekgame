<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coin Collector</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        text-align: center;
      }

      h1 {
        margin: 20px 0 10px;
      }

      #game {
        position: relative;
        width: 800px;
        height: 500px;
        margin: 20px auto;
        background: #222;
        border: 3px solid white;
        overflow: hidden;
      }

      #player {
        position: absolute;
        width: 40px;
        height: 40px;
        background: dodgerblue;
        border-radius: 10px;
        left: 50px;
        top: 50px;
      }

      #coin {
        position: absolute;
        width: 30px;
        height: 30px;
        background: gold;
        border-radius: 50%;
        left: 400px;
        top: 250px;
      }

      #score {
        font-size: 24px;
        margin-top: 10px;
      }

      #message {
        font-size: 22px;
        margin-top: 10px;
      }

      button {
        padding: 10px 20px;
        font-size: 18px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <h1>🪙 Coin Collector</h1>

    <div id="score">Ball: 0 / 10</div>

    <div id="game">
      <div id="player"></div>
      <div id="coin"></div>
    </div>

    <div id="message">⬅️ ➡️ ⬆️ ⬇️ tugmalari bilan harakatlaning</div>

    <button onclick="restartGame()">Qayta boshlash</button>

    <script>
      const player = document.getElementById("player");
      const coin = document.getElementById("coin");
      const scoreText = document.getElementById("score");
      const message = document.getElementById("message");

      let playerX = 50;
      let playerY = 50;

      let score = 0;

      const speed = 10;

      document.addEventListener("keydown", function (event) {
        if (event.key === "ArrowUp" || event.key === "w") {
          playerY -= speed;
        }

        if (event.key === "ArrowDown" || event.key === "s") {
          playerY += speed;
        }

        if (event.key === "ArrowLeft" || event.key === "a") {
          playerX -= speed;
        }

        if (event.key === "ArrowRight" || event.key === "d") {
          playerX += speed;
        }

        // Devordan chiqib ketmaslik
        if (playerX < 0) {
          playerX = 0;
        }

        if (playerY < 0) {
          playerY = 0;
        }

        if (playerX > 760) {
          playerX = 760;
        }

        if (playerY > 460) {
          playerY = 460;
        }

        player.style.left = playerX + "px";
        player.style.top = playerY + "px";

        checkCollision();
      });

      function moveCoin() {
        const randomX = Math.floor(Math.random() * 770);
        const randomY = Math.floor(Math.random() * 470);

        coin.style.left = randomX + "px";
        coin.style.top = randomY + "px";
      }

      function checkCollision() {
        const playerRect = player.getBoundingClientRect();
        const coinRect = coin.getBoundingClientRect();

        if (
          playerRect.left < coinRect.right &&
          playerRect.right > coinRect.left &&
          playerRect.top < coinRect.bottom &&
          playerRect.bottom > coinRect.top
        ) {
          score++;

          scoreText.textContent = `Ball: ${score} / 10`;

          moveCoin();

          if (score >= 10) {
            message.textContent = "🎉 Tabriklayman! Siz yutdingiz!";
          }
        }
      }

      function restartGame() {
        playerX = 50;
        playerY = 50;
        score = 0;

        player.style.left = playerX + "px";
        player.style.top = playerY + "px";

        scoreText.textContent = "Ball: 0 / 10";
        message.textContent = "⬅️ ➡️ ⬆️ ⬇️ tugmalari bilan harakatlaning";

        moveCoin();
      }

      moveCoin();
    </script>
  </body>
</html>
